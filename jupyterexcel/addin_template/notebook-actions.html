      <section id="notebook-actions" aria-label="Notebook Actions">
        <details id="action-details" open>
        <summary class="action-summary"><h2>Notebook Actions</h2></summary>
        <label>Action <select id="action-select"></select></label>
        <button id="action-refresh" type="button">Refresh actions</button>
        <p id="action-description"></p>
        <p>Cells are read when you run. Manual fills only; hidden and filtered cells are included. Results are snapshots: run again after editing cells or colors.</p>
        <fieldset id="action-inputs"></fieldset>
        <button id="action-run" type="button" disabled>Run</button>
        <p id="action-status" role="status" aria-live="polite"></p>
        <label id="action-target-label" hidden>Starting Cell <input id="action-target" readonly placeholder="Click here, then select one cell in Excel" /></label>
        <button id="action-write" type="button" hidden>Write to cells</button>
        <div id="action-result"></div>
        <button id="action-popup" type="button" hidden>Show dialog</button>
        <button id="action-updates" type="button" hidden>Apply input updates</button>
        <dialog id="action-dialog"><div id="action-dialog-content"></div><button id="action-dialog-close" type="button">Close</button></dialog>
        </details>
      </section>
    <section><h2>Worksheet functions</h2><ul>{{WORKSHEET_ROWS}}</ul><h2>Ribbon functions</h2><ul>{{RIBBON_ROWS}}</ul></section>
